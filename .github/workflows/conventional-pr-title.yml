name: Conventional PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, development]

permissions:
  contents: read

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"

          # Conventional Commits regex:
          # type(scope)!: subject
          # - type: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert
          # - scope: optional, alphanumeric with hyphens
          # - !: optional breaking change marker
          # - subject: 1-72 chars, must not be empty
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .*$'

          if echo "$PR_TITLE" | grep -qP "$PATTERN"; then
            echo "✅ PR title follows Conventional Commits format."
          else
            echo "❌ PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected format: type(scope)!: subject"
            echo ""
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Scope is optional (e.g. feat(cli): ...) but must be alphanumeric/hyphens if provided."
            echo "Subject must be 1-72 characters."
            echo ""
            echo "Examples:"
            echo "  feat(cli): add --dry-run flag to firestore export"
            echo "  fix(rtdb): handle missing databaseURL gracefully"
            echo "  chore: bump version to 0.6.0"
            echo "  docs: update README with new auth commands"
            exit 1
          fi
